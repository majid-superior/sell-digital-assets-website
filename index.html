<!-- index.html -->
<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark light" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: http: https: http://localhost:* http://127.0.0.1:*; connect-src 'self' http://localhost:* ws://localhost:* https:; object-src 'none';"
    />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Assets Marketplace</title>
    <!-- Dynamic Theme Pre-paint Injector: 0ms Flash Prevention -->
    <script>
      (function () {
        try {
          // Pre-populate Zod v4 global config with jitless: true for strict CSP compatibility (skips new Function probe)
          window.__zod_globalConfig = Object.assign(window.__zod_globalConfig || {}, { jitless: true });

          var stored = localStorage.getItem("theme");
          var theme =
            stored === "dark" || stored === "light" ? stored : "dark";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.setAttribute("data-theme", "dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.setAttribute("data-theme", "light");
            document.documentElement.style.colorScheme = "light";
          }

          var cached = localStorage.getItem("theme_css");
          if (cached && typeof cached === "string") {
            // Validate cached CSS contains no script/style breakouts or executable constructs
            if (!/[<>]/.test(cached) && !/\b(?:javascript|expression|url)\b/i.test(cached)) {
              var styleEl = document.getElementById("dynamic-theme-vars");
              if (!styleEl) {
                styleEl = document.createElement("style");
                styleEl.id = "dynamic-theme-vars";
                document.head.appendChild(styleEl);
              }
              styleEl.textContent = cached;
            }
          }

          var cachedOrgTitle = localStorage.getItem("organization_title");
          if (cachedOrgTitle && typeof cachedOrgTitle === "string") {
            var cleanTitle = cachedOrgTitle.replace(/[<>]/g, "").trim();
            if (cleanTitle) {
              document.title = cleanTitle + " | Marketplace";
            }
          }
          var cachedFavicon = localStorage.getItem("organization_favicon");
          if (cachedFavicon && typeof cachedFavicon === "string") {
            var trimmedFav = cachedFavicon.trim();
            var isSafeFav =
              (trimmedFav.indexOf("/") === 0 &&
                trimmedFav.indexOf("//") !== 0 &&
                trimmedFav.indexOf("/\\") !== 0 &&
                trimmedFav.indexOf("\\") === -1) ||
              trimmedFav.indexOf("http://") === 0 ||
              trimmedFav.indexOf("https://") === 0;
            if (isSafeFav) {
              var favEl = document.querySelector("link[rel*='icon']");
              if (favEl) favEl.href = trimmedFav;
            }
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-theme", "dark");
          document.documentElement.style.colorScheme = "dark";
          console.warn("Theme pre-paint error:", e);
        }
      })();
    </script>
  </head>

  <body class="bg-background text-on-surface antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
